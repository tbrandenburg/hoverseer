apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: hoverseer
resources:
  - deploy/kubernetes/stack.yaml
  - deploy/kubernetes/dashboard.yaml
configMapGenerator:
  - name: workflow-seed
    files:
      - deploy/seed-workflows.sh
      - refund-review.yaml=workflows/refund-review/workflow.yaml
      - article-review.yaml=workflows/article-review/workflow.yaml
  - name: managed-workflows
    files:
      - managed-workflows.yaml=workflows/catalog.yaml
  - name: gateway-source
    files:
      - gateway/server.mjs
      - hitly-client.mjs=integrations/hitly/client.mjs
      - gateway/openapi.json
  - name: dashboard-config
    files:
      - deploy/dashboard/settings.yaml
      - deploy/dashboard/services.yaml
      - deploy/dashboard/widgets.yaml
      - deploy/dashboard/bookmarks.yaml
