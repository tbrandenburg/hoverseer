apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: hoverseer
resources:
  - k8s/stack.yaml
configMapGenerator:
  - name: workflow-seed
    files:
      - deploy/seed-workflows.sh
      - refund-review.yaml=workflows/refund-review/workflow.yaml
      - article-review.yaml=workflows/article-review/workflow.yaml
  - name: managed-workflows
    files:
      - deploy/managed-workflows.yaml
  - name: gateway-source
    files:
      - gateway/server.mjs
      - gateway/openapi.json
