name: hoverseer
services:
  dashboard:
    image: ghcr.io/gethomepage/homepage:v2.8.0
    environment:
      HOMEPAGE_ALLOWED_HOSTS: ${HOVERSEER_DASHBOARD_HOSTS:-localhost:${HOVERSEER_DASHBOARD_PORT:-8082},127.0.0.1:${HOVERSEER_DASHBOARD_PORT:-8082}}
      HOMEPAGE_VAR_STUDIO_URL: ${HOVERSEER_STUDIO_URL:-http://localhost:3000}
      HOMEPAGE_VAR_HOTL_URL: ${HOVERSEER_HOTL_URL:-http://localhost:3001}
      HOMEPAGE_VAR_TEMPORAL_URL: ${HOVERSEER_TEMPORAL_WEB_URL:-http://localhost:8233}
      HOMEPAGE_VAR_API_DOCS_URL: ${HOVERSEER_API_DOCS_URL:-http://localhost:${HOVERSEER_API_PORT:-8081}/openapi.json}
      HOMEPAGE_VAR_INFISICAL_URL: ${HOVERSEER_INFISICAL_UI_URL:-http://localhost:8084}
    volumes:
      - ./deploy/dashboard/settings.yaml:/app/config/settings.yaml:ro
      - ./deploy/dashboard/services.yaml:/app/config/services.yaml:ro
      - ./deploy/dashboard/widgets.yaml:/app/config/widgets.yaml:ro
      - ./deploy/dashboard/bookmarks.yaml:/app/config/bookmarks.yaml:ro
    ports:
      - "127.0.0.1:${HOVERSEER_DASHBOARD_PORT:-8082}:3000"
  temporal:
    image: temporalio/temporal:1.10.1
    command: [server, start-dev, --ip, 0.0.0.0, --db-filename, /var/lib/temporal/temporal.db]
    volumes:
      - temporal-data:/var/lib/temporal
    depends_on:
      workflow-seed:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:8233:8233"
    healthcheck:
      test: [CMD, temporal, operator, cluster, health]
      interval: 3s
      timeout: 3s
      retries: 30
  workflow-seed:
    image: alpine:3.23
    command: [sh, -ec, 'sh /seed-workflows.sh; chown 1000:1000 /var/lib/temporal']
    volumes:
      - workflow-data:/workflows
      - ./workflows:/seed:ro
      - ./deploy/seed-workflows.sh:/seed-workflows.sh:ro
      - temporal-data:/var/lib/temporal
  studio:
    image: hoverseer-studio:local
    build:
      context: .
      dockerfile: deploy/images/studio.Dockerfile
    depends_on:
      workflow-seed:
        condition: service_completed_successfully
    volumes:
      - workflow-data:/workflows
    ports:
      - "127.0.0.1:3000:3000"
  zigflow:
    image: ghcr.io/zigflow/zigflow:0.18.1
    command: [run, --disable-telemetry, --dir, /workflows, --glob, "*/workflow.yaml"]
    environment:
      TEMPORAL_ADDRESS: temporal:7233
    depends_on:
      temporal:
        condition: service_healthy
      workflow-seed:
        condition: service_completed_successfully
    volumes:
      - workflow-data:/workflows:ro
    restart: on-failure
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: hitly
      POSTGRES_DB: hitly
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run ./hoverseer init}
    volumes:
      - hitly-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD, pg_isready, -U, hitly, -d, hitly]
      interval: 3s
      timeout: 3s
      retries: 30
  hotl:
    image: hoverseer-hitly:local
    build:
      context: .
      dockerfile: deploy/images/hitly.Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://hitly:${POSTGRES_PASSWORD}@postgres:5432/hitly
      BETTER_AUTH_URL: http://localhost:3001
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Run ./hoverseer init}
      HITLY_REQUIRE_VERIFIED_EMAIL: "false"
      HITLY_MAIL_TRANSPORT: log
    ports:
      - "127.0.0.1:3001:3001"
  cruncher:
    image: hoverseer-cruncher:local
    build:
      context: .
      dockerfile: deploy/images/cruncher.Dockerfile
    depends_on:
      temporal:
        condition: service_healthy
    restart: on-failure
    env_file:
      - path: ./cruncher/.env.infisical
        required: false
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      HITLY_PROJECT_ID: ${HITLY_PROJECT_ID:-}
      HITLY_API_KEY: ${HITLY_API_KEY:-}
  approval-gateway:
    image: hoverseer-gateway:local
    build:
      context: .
      dockerfile: deploy/images/gateway.Dockerfile
    environment:
      HITLY_PROJECT_ID: ${HITLY_PROJECT_ID:-}
      HITLY_API_KEY: ${HITLY_API_KEY:-}
  api:
    image: hoverseer-api:local
    build:
      context: .
      dockerfile: deploy/images/api.Dockerfile
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      HOVERSEER_CATALOG: /catalog/catalog.yaml
      HOVERSEER_API_TOKEN: ${HOVERSEER_API_TOKEN:-}
      HOVERSEER_PUBLIC_URL: ${HOVERSEER_PUBLIC_URL:-http://localhost:${HOVERSEER_API_PORT:-8081}}
    depends_on:
      temporal:
        condition: service_healthy
      workflow-seed:
        condition: service_completed_successfully
    volumes:
      - workflow-data:/workflows:ro
      - ./workflows:/catalog:ro
    ports:
      - "127.0.0.1:${HOVERSEER_API_PORT:-8081}:8081"
volumes:
  temporal-data:
  hitly-data:
  workflow-data:
