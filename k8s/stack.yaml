apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: temporal-data
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: hitly-data
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: workflow-data
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 100Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: temporal
spec:
  strategy:
    type: Recreate
  selector:
    matchLabels: {app: temporal}
  template:
    metadata:
      labels: {app: temporal}
    spec:
      initContainers:
        - name: temporal-volume
          image: alpine:3.23
          command: [chown, "1000:1000", /var/lib/temporal]
          volumeMounts:
            - {name: data, mountPath: /var/lib/temporal}
      containers:
        - name: temporal
          image: temporalio/temporal:1.10.1
          args: [server, start-dev, --ip, 0.0.0.0, --db-filename, /var/lib/temporal/temporal.db]
          ports:
            - {name: grpc, containerPort: 7233}
            - {name: web, containerPort: 8233}
          readinessProbe:
            exec:
              command: [temporal, operator, cluster, health]
          volumeMounts:
            - {name: data, mountPath: /var/lib/temporal}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: temporal-data}
---
apiVersion: v1
kind: Service
metadata:
  name: temporal
spec:
  selector: {app: temporal}
  ports:
    - {name: grpc, port: 7233, targetPort: grpc}
    - {name: web, port: 8233, targetPort: web}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: workflow
spec:
  strategy:
    type: Recreate
  selector:
    matchLabels: {app: workflow}
  template:
    metadata:
      labels: {app: workflow}
    spec:
      initContainers:
        - name: seed
          image: alpine:3.23
          command: [sh, -ec, 'mkdir -p /workflows/refund-review; test -f /workflows/refund-review/workflow.yaml || cp /seed/workflow.yaml /workflows/refund-review/workflow.yaml; chown -R 1000:1000 /workflows']
          volumeMounts:
            - {name: workflow-seed, mountPath: /seed, readOnly: true}
            - {name: workflow-data, mountPath: /workflows}
      containers:
        - name: studio
          image: hoverseer-studio:local
          imagePullPolicy: IfNotPresent
          ports:
            - {name: studio, containerPort: 3000}
          readinessProbe:
            httpGet: {path: /, port: studio}
          volumeMounts:
            - {name: workflow-data, mountPath: /workflows}
        - name: zigflow
          image: ghcr.io/zigflow/zigflow:0.18.1
          args: [run, --disable-telemetry, --health-listen-address, "0.0.0.0:3002", -f, /workflows/refund-review/workflow.yaml]
          env:
            - {name: TEMPORAL_ADDRESS, value: "temporal:7233"}
          readinessProbe:
            httpGet: {path: /readyz, port: 3002}
          volumeMounts:
            - {name: workflow-data, mountPath: /workflows, readOnly: true}
      volumes:
        - name: workflow-data
          persistentVolumeClaim: {claimName: workflow-data}
        - name: workflow-seed
          configMap: {name: workflow-seed}
---
apiVersion: v1
kind: Service
metadata:
  name: studio
spec:
  selector: {app: workflow}
  ports:
    - {port: 3000, targetPort: studio}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
spec:
  strategy:
    type: Recreate
  selector:
    matchLabels: {app: postgres}
  template:
    metadata:
      labels: {app: postgres}
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - {name: database, containerPort: 5432}
          env:
            - {name: POSTGRES_USER, value: hitly}
            - {name: POSTGRES_DB, value: hitly}
            - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: {name: hoverseer-config, key: POSTGRES_PASSWORD}
          readinessProbe:
            exec:
              command: [pg_isready, -U, hitly, -d, hitly]
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql/data}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: hitly-data}
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  selector: {app: postgres}
  ports:
    - {port: 5432, targetPort: database}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hitly
spec:
  strategy:
    type: Recreate
  selector:
    matchLabels: {app: hitly}
  template:
    metadata:
      labels: {app: hitly}
    spec:
      containers:
        - name: hitly
          image: hoverseer-hitly:local
          imagePullPolicy: IfNotPresent
          ports:
            - {name: inbox, containerPort: 3001}
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: {name: hoverseer-config, key: POSTGRES_PASSWORD}
            - name: BETTER_AUTH_SECRET
              valueFrom:
                secretKeyRef: {name: hoverseer-config, key: BETTER_AUTH_SECRET}
            - {name: DATABASE_URL, value: "postgres://hitly:$(POSTGRES_PASSWORD)@postgres:5432/hitly"}
            - {name: BETTER_AUTH_URL, value: "http://localhost:3001"}
            - {name: HITLY_REQUIRE_VERIFIED_EMAIL, value: "false"}
            - {name: HITLY_MAIL_TRANSPORT, value: log}
          readinessProbe:
            httpGet: {path: /api/v1/health, port: inbox}
            timeoutSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: hitly
spec:
  selector: {app: hitly}
  ports:
    - {port: 3001, targetPort: inbox}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: approval-gateway
spec:
  selector:
    matchLabels: {app: approval-gateway}
  template:
    metadata:
      labels: {app: approval-gateway}
    spec:
      containers:
        - name: gateway
          image: node:24-bookworm-slim
          command: [node, /gateway/server.mjs]
          ports:
            - {name: http, containerPort: 8080}
          env:
            - name: HITLY_PROJECT_ID
              valueFrom:
                secretKeyRef: {name: hoverseer-config, key: HITLY_PROJECT_ID}
            - name: HITLY_API_KEY
              valueFrom:
                secretKeyRef: {name: hoverseer-config, key: HITLY_API_KEY}
          readinessProbe:
            httpGet: {path: /health, port: http}
          securityContext:
            runAsUser: 1000
            runAsNonRoot: true
          volumeMounts:
            - {name: source, mountPath: /gateway, readOnly: true}
      volumes:
        - name: source
          configMap: {name: gateway-source}
---
apiVersion: v1
kind: Service
metadata:
  name: approval-gateway
spec:
  selector: {app: approval-gateway}
  ports:
    - {port: 8080, targetPort: http}
